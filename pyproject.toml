[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kleos-models"
version = "0.1.0"
description = "Research engineering repository for KLEOS model fine-tuning and evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "KLEOS Research" }]
keywords = ["llm", "qlora", "peft", "fine-tuning", "evaluation", "reproducibility"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core dependencies are deliberately light.
#
# The data / config / evaluation-scoring layers MUST remain importable without
# torch or transformers installed. That keeps dataset work, CI, and local
# development fast, and it is enforced by tests/test_import_isolation.py.
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0",
  "jsonschema>=4.21",
  "numpy>=1.26",
]

[project.optional-dependencies]
# Everything needed to actually load models and train adapters.
# Installed on Colab / CUDA machines, not required for the data layer.
train = [
  "torch>=2.4",
  "transformers>=4.56,<6",
  "peft>=0.12",
  "accelerate>=0.34",
  "datasets>=2.20",
  "safetensors>=0.4.3",
  "huggingface-hub>=0.25",
  "sentencepiece>=0.2",
]
# bitsandbytes is CUDA-only in practice; keep it separately installable so that
# `pip install .[train]` still works on macOS / CPU-only machines.
quant = [
  "bitsandbytes>=0.43",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "nbformat>=5.10",
]
# Optional accelerated training backend. Isolated on purpose: the canonical
# training path must stay understandable with plain transformers + peft.
unsloth = [
  "unsloth>=2024.8",
]
all = [
  "kleos-models[train,quant,dev]",
]

[project.scripts]
kleos = "kleos_models.cli:main"

[project.urls]
Homepage = "https://github.com/kleos/kleos-models"
Documentation = "https://github.com/kleos/kleos-models/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/kleos_models"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # comprehensions
  "UP",  # pyupgrade
  "SIM", # simplify
  "RUF", # ruff-specific
]
ignore = [
  "E501",   # line length is handled by the formatter
  "B008",   # function call in default argument
  "SIM108", # ternary operators are not always clearer
  # `class X(str, Enum)` is deliberate: it keeps enum members JSON-serializable
  # and comparable to plain strings, which pydantic and the manifest writers
  # both rely on. StrEnum would work on 3.11+ but changes `str()` semantics.
  "UP042",
  # Report text uses real typography (x for dimensions, en dashes in ranges).
  # These strings are human-facing output, not identifiers.
  "RUF001",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"scripts/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["kleos_models"]

[tool.mypy]
# 3.12, not 3.11: recent numpy stubs use `type` statement syntax that mypy only
# parses under 3.12+. Runtime support is still 3.11+ — that is enforced by
# `requires-python` and by the CI test matrix, which runs 3.11, 3.12 and 3.13.
python_version = "3.12"
files = ["src/kleos_models"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
# torch / transformers / peft are optional imports resolved at runtime.
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = ["torch.*", "transformers.*", "peft.*", "bitsandbytes.*", "datasets.*", "accelerate.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
  "requires_torch: test needs torch + transformers installed (skipped otherwise)",
  "requires_peft: test needs peft installed (skipped otherwise)",
  "requires_cuda: test needs a CUDA GPU (skipped otherwise)",
  "slow: test builds a tiny model and runs real training steps",
]
filterwarnings = [
  "ignore::DeprecationWarning:pkg_resources.*",
]
