# ---------------------------------------------------------------------------
# Serving configuration for the KLEOS v0.0.6 policy adapter.
#
# This file is a DECLARATIVE RECORD for whatever serves the model — this
# repository trains and evaluates, it does not host. The KLEOS backend reads
# these values; nothing here starts a server.
#
# THE BASE REVISION MUST MATCH configs/models/ministral_8b.yaml.
# A LoRA adapter encodes deltas against specific base weights. Serving a
# different revision than was trained pairs the adapter with weights it never
# saw, and the failure is silent — no error, just degraded judgment.
# tests/test_revision_pinning.py asserts the two files agree, so they cannot
# drift apart unnoticed.
#
# The adapter itself is NOT in this repository. It lives on private storage
# (see docs/experiments.md) and its path is supplied by the deployment
# environment.
# ---------------------------------------------------------------------------

deployment:
  name: kleos-policy-v006-ministral8b
  experiment_id: kleos-v006-ministral8b-run1

  base_model: mistralai/Ministral-8B-Instruct-2410
  # Pinned 2026-09-15; identical to the training config by construction.
  revision: 2f494a194c5b980dfb9772cb92d26cbb671fce5a
  auto_class: AutoModelForCausalLM

  # Supplied by the environment. Never commit an adapter path that points into
  # private storage, and never commit the weights themselves.
  adapter_path: ${env:KLEOS_ADAPTER_PATH:}

  # The tokenizer comes from the BASE model at the same pinned revision. The
  # adapter does not ship one: KLEOS never adds tokens or resizes embeddings
  # (LoRA excludes embed_tokens and lm_head), so the base tokenizer is the
  # correct one. See docs/publishing.md.
  tokenizer: mistralai/Ministral-8B-Instruct-2410

  quantization:
    # Matches training. Serving unquantized is valid and will differ slightly;
    # serving at a different quantization than evaluated is a change worth
    # measuring rather than assuming.
    mode: nf4
    double_quant: true
    compute_dtype: auto

  generation:
    # Greedy, matching the evaluation conditions the reported scores came from.
    # Sampling will not reproduce those numbers.
    temperature: 0.0
    top_p: 1.0
    do_sample: false
    max_new_tokens: 512

  # KNOWN LIMITATIONS OF THIS ADAPTER — see docs/experiments.md for the evidence.
  # These are not hypothetical; they were measured on the held-out split.
  notes:
    - "Outputs prose/bullets, NOT JSON. format_valid was 0.0000 on all 349
       held-out examples. Any consumer expecting structured output must parse
       prose — kleos_models.evaluation.graders has tested extractors."
    - "Over-commits. On the 28 held-out cases where the reference declines to
       answer, it declined 0 times. It never wrongly abstains, so the error is
       one-sided overconfidence."
    - "Unstable under rephrasing: 10 of 15 scenario groups changed decision
       under a logically irrelevant perturbation."
    - "Base model is under the Mistral Research Licence (non-commercial).
       Commercial deployment requires a separate agreement with Mistral."
