# ---------------------------------------------------------------------------
# Ministral-8B-Instruct-2410 — the 8B text-only Mistral arm.
#
# WHY THIS CONFIG EXISTS
# Comparing a 24B multimodal checkpoint (Mistral-Small-3.2) against a smaller
# text-only one confounds parameter count and modality. Ministral-8B is a plain
# text-only MistralForCausalLM at 8B, so comparisons against it control for
# modality; use mistral_small_3_2 when the question is about the specific 24B
# checkpoint. This was the base of the first KLEOS research run (2026-09-15).
#
# Verified: architectures ["MistralForCausalLM"], model_type mistral,
#   36 layers, hidden 4096, vocab 131072, max_position_embeddings 32768
# ---------------------------------------------------------------------------

model:
  name: ministral_8b
  family: mistral
  base_model: mistralai/Ministral-8B-Instruct-2410
  # Pinned 2026-09-15. `main` is a moving pointer: a LoRA adapter is trained
  # against specific base weights, so if upstream re-uploads, the adapter is
  # silently paired with weights it never saw. There is no error — the outputs
  # just get worse. Pinning also fixes the licence text that was accepted, since
  # a repository can change its terms on a later revision.
  #
  # This pin applies to FUTURE runs only. kleos-policy-v0.0.6 was trained with
  # `revision: main` and the commit it resolved to is NOT recoverable from the
  # preserved artifacts — see docs/experiments.md. Do not backfill this SHA into
  # the historical record.
  revision: 2f494a194c5b980dfb9772cb92d26cbb671fce5a
  trust_remote_code: false

  # transformers 5.x gave Ministral its own model_type (interleaved
  # sliding-window attention); 4.x reported these checkpoints as 'mistral'.
  # Declared as the checkpoint currently reports it so the manifest records what
  # actually loaded. Both values resolve to MistralDenseAdapter, and the loader
  # trusts the checkpoint either way, so this is safe on both versions.
  #
  # architecture stays MistralForCausalLM: the checkpoint's config.json still
  # declares that in `architectures`, even though transformers instantiates
  # MinistralForCausalLM from the model_type. That mismatch is upstream's, and
  # it is the source of the harmless "using a model of type mistral to
  # instantiate a model of type ministral" warning during training.
  model_type: ministral
  architecture: MistralForCausalLM
  parameter_count: 8.0e9
  is_moe: false
  is_multimodal: false
  context_limit: 32768

  max_seq_length: 2048
  dtype: auto
  attn_implementation: sdpa
  device_map: auto

  reasoning:
    # No reasoning mode. Requesting 'thinking' raises rather than faking it.
    supported: false
    default_mode: standard

  quantization:
    mode: nf4
    compute_dtype: auto
    double_quant: true

  lora:
    target_modules: auto
    r: 16
    alpha: 32
    dropout: 0.05
    bias: none
    task_type: CAUSAL_LM

  notes: >-
    Text-only 8B Mistral checkpoint, so a comparison against it is not
    confounded with modality. Gated repository: accept the license on Hugging
    Face and set HF_TOKEN.
